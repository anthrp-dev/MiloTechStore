<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Permite que la página se adapte a celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título que aparece en la pestaña del navegador -->
    <title>MiloTechStore - Cart</title>
    <!-- Estilos generales de la aplicación -->
    <link rel="stylesheet" href="assets/css/styles.css">
    <!-- Estilos específicos de la página del carrito -->
    <link rel="stylesheet" href="assets/css/cart.css">
</head>

<body>
    <!-- Barra de navegación superior -->
   <header class="navbar">
    <!-- Nombre de la tienda -->
    <div class="brand-header">
        <span class="brand-name">MiloTechStore</span>
    </div>

    <!-- Muestra el nombre del usuario autenticado -->
   <div class="welcome-message">
    <span>Welcome, <strong id="user-name-display">User</strong></span>
   </div>

   <!-- Botón para regresar al catálogo de productos -->
   <a href="home.html" class="btn-cart">←Continue shopping</a>
   </header>

   <!-- Contenido principal de la página -->
<main class="cart-wrapper-page">
    
    <div class="header-text">
        <h1 class="title">Your cart</h1>
        <p class="subtitle">Review your products before checking out.</p>
    </div>

    <div id="cart-empty" class="cart-empty hidden">
        <p>Your cart is empty.</p>
        <a href="home.html" class="btn-primary">View products</a>
    </div>

    <div id="cart-content" class="cart-layout hidden">
        <!-- Columna izquierda: lista de productos -->
        <section id="cart-items" class="cart-list"></section>

        <!-- Columna derecha: resumen fijo -->
        <aside class="cart-summary">
            <h2 class="summary-title">Order Summary</h2>

            <div class="summary-row">
                <span>Subtotal</span>
                <span id="cart-total">$0.00</span>
            </div>

            <button id="checkout-btn" class="btn-primary">Checkout</button>
            <button id="clear-cart-btn" class="btn-secondary">Clear cart</button>
        </aside>
    </div>
</main>

<!-- Script principal de la página del carrito -->
<script type="module" src="js/pages/cart.js"></script>
</body>
</html>
