<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiloTechStore - Admin Panel</title>
    <link rel="stylesheet" href="assets/css/home.css" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="brand-header">
        <span class="brand-name">MiloTechStore (Admin)</span>
      </div>

      <div class="welcome-message">
        <span>Welcome, <strong id="user-name-display">Admin</strong></span>
      </div>

      <!-- Botón para el administrador -->
      <div class="admin-wrapper" style="margin-right: 15px;">
        <button id="open-add-product-btn" class="btn-primary" style="padding: 0.5rem 1rem; margin-top: 0;">
          + New Product
        </button>
      </div>
    </header>

    <main class="catalog-wrapper">
      <div class="header-text">
        <h1 class="title">Inventory Management</h1>
        <p class="subtitle">Manage your catalog products in real-time.</p>
      </div>

      <section id="product-container" class="product-grid">
        <!-- The products will be dynamically inserted here -->
      </section>
    </main>

    <!-- VENTANA EMERGENTE: DETALLES DEL PRODUCTO -->
    <div id="product-modal" class="modal hidden">
        <div class="modal-content">
            <button id="close-modal-btn" class="close-btn">&times;</button>
            
            <div id="modal-details" class="modal-body">
               <!--here the product details will be dynamically inserted here--> 
            </div>
        </div>
    </div>
    
    <!-- HU-02: VENTANA EMERGENTE PARA AGREGAR PRODUCTO -->
    <div id="add-product-modal" class="modal hidden">
        <div class="modal-content">
            <button id="close-add-modal-btn" class="close-btn">&times;</button>
            <h2 class="title" style="margin-bottom: 1.5rem;">Add New Product</h2>
            
            <form id="add-product-form" class="form-grid">
                <div class="input-group">
                    <label for="new-title">Product Name</label>
                    <input type="text" id="new-title" required placeholder="Ex. Mechanical Keyboard">
                </div>
                
                <div class="input-group">
                    <label for="new-price">Price ($)</label>
                    <input type="number" id="new-price" required step="0.01" min="0.01" placeholder="Ex. 45.99">
                </div>

                <div class="input-group">
                    <label for="new-stock">Stock</label>
                    <input type="number" id="new-stock" required min="0" placeholder="Ex. 10">
                </div>
                
                <div class="input-group full-width">
                    <label for="new-image">Image URL</label>
                    <input type="url" id="new-image" required placeholder="https://example.com/image.jpg">
                </div>

                <div class="input-group full-width">
                    <label for="new-description">Description</label>
                    <textarea id="new-description" required rows="3" placeholder="Product details and features..."></textarea>
                </div>

                <button type="submit" class="btn-primary full-width" style="margin-top: 1rem;">Save to Inventory</button>
            </form>
        </div>
    </div>

    <!-- Script principal -->
    <script type="module" src="js/pages/product.js"></script>
  </body>
</html>
