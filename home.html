<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiloTechStore-Productos</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="stylesheet" href="assets/css/home.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="brand-header">
        <span class="brand-name">MiloTechStore</span>
      </div>

      <div class="welcome-message">
        <span>Bienvenido, <strong id="user-name-display">Usuario</strong></span>
      </div>

      <div class="cart-wrapper">
        <a href="cart.html" id="cart-btn" class="btn-cart">
          🛒 Cart (<span id="cart-count">0</span>)
        </a>
      </div>
    </header>

    <main class="catalog-wrapper">
      <div class="header-text">
        <h1 class="title">Nuestros Productos</h1>
        <p class="subtitle">Explora lo mejor en tecnología</p>
      </div>

      <section id="product-container" class="product-grid">
        <!-- The products will be dynamically inserted here -->
      </section>

    </main>
    <div id="product-modal" class="modal hidden">
        <div class="modal-content">
            <button id="close-modal-btn" class="close-btn">&times;</button>
            
            <div id="modal-details" class="modal-body">
           <!--here the product details will be dynamically inserted here--> 
            </div>
        </div>
    </div>
    <script type="module" src="js/pages/product.js"></script>
  </body>
</html>
